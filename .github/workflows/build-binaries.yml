name: Build and Publish Binaries

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            node-version: '16.20.2'
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            node-version: '16.20.2'
          - os: macos-latest
            platform: darwin
            arch: arm64
            node-version: '16.20.2'
          - os: windows-latest
            platform: win32
            arch: x64
            node-version: '16.20.2'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: npm ci --ignore-engines

    - name: Build binary
      run: |
        npm run build
        npm run package
      env:
        npm_config_target: ${{ matrix.node-version }}
        npm_config_arch: ${{ matrix.arch }}
        npm_config_target_platform: ${{ matrix.platform }}

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.platform }}-${{ matrix.arch }}-node${{ matrix.node-version }}
        path: build/stage/naudiodon2/${{ github.event.release.tag_name }}/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16.20.2'
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: npm ci --ignore-engines

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: build/

    - name: Prepare binaries for publishing
      run: |
        # Debug: Show what we downloaded
        echo "=== Downloaded artifacts ==="
        ls -la build/
        echo ""
        
        # Create the staging directory structure
        mkdir -p "build/stage/naudiodon2/${{ github.event.release.tag_name }}/"
        echo "Created staging directory: build/stage/naudiodon2/${{ github.event.release.tag_name }}/"
        
        # Find all tar.gz files in subdirectories and process them
        echo "=== Searching for tar.gz files ==="
        find build/ -name "*.tar.gz" -type f
        echo ""
        
        find build/ -name "*.tar.gz" -type f | while read artifact; do
          echo "Processing artifact: $artifact"
          # Extract platform-arch from artifact name
          # The files are already named correctly: node-v93-{platform}-{arch}.tar.gz
          filename=$(basename "$artifact")
          echo "Filename: $filename"
          
          # Just copy the file directly since it's already named correctly
          cp "$artifact" "build/stage/naudiodon2/${{ github.event.release.tag_name }}/$filename"
          echo "Copied to: build/stage/naudiodon2/${{ github.event.release.tag_name }}/$filename"
        done
        
        # List what we have
        echo ""
        echo "=== Available binaries ==="
        ls -la build/stage/naudiodon2/${{ github.event.release.tag_name }}/
        
        # Debug: Check if the specific file exists
        echo ""
        echo "=== Checking for specific file ==="
        if [ -f "build/stage/naudiodon2/${{ github.event.release.tag_name }}/node-v93-linux-x64.tar.gz" ]; then
          echo "✅ node-v93-linux-x64.tar.gz exists"
        else
          echo "❌ node-v93-linux-x64.tar.gz missing"
        fi
        
        # Debug: Show the final staging directory structure
        echo ""
        echo "=== Final staging directory structure ==="
        find build/stage/ -type f

    - name: Publish binaries
      run: npm run publish-binary
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 