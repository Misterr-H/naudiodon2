name: Build and Publish Binaries

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            node-version: '16.20.2'
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            node-version: '16.20.2'
          - os: macos-latest
            platform: darwin
            arch: arm64
            node-version: '16.20.2'
          - os: windows-latest
            platform: win32
            arch: x64
            node-version: '16.20.2'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: npm ci --ignore-engines

    - name: Build binary
      run: |
        npm run build
        npm run package
      env:
        npm_config_target: ${{ matrix.node-version }}
        npm_config_arch: ${{ matrix.arch }}
        npm_config_target_platform: ${{ matrix.platform }}

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.platform }}-${{ matrix.arch }}-node${{ matrix.node-version }}
        path: build/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16.20.2'
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: npm ci --ignore-engines

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: build/

    - name: Prepare binaries for publishing
      run: |
        # Create the staging directory structure
        mkdir -p "build/stage/naudiodon2/v2.4.2/"
        
        # Copy and rename artifacts to the expected location
        for artifact in build/*.tar.gz; do
          if [ -f "$artifact" ]; then
            echo "Processing artifact: $artifact"
            # Extract platform-arch from artifact name
            # Format: binary-{platform}-{arch}-node{version}.tar.gz
            filename=$(basename "$artifact")
            platform_arch=$(echo "$filename" | sed 's/binary-\(.*\)-node.*\.tar\.gz/\1/')
            
            # Copy to the expected location for node-pre-gyp
            cp "$artifact" "build/stage/naudiodon2/v2.4.2/node-v93-${platform_arch}.tar.gz"
            echo "Copied to: build/stage/naudiodon2/v2.4.2/node-v93-${platform_arch}.tar.gz"
          fi
        done
        
        # List what we have
        echo "Available binaries:"
        ls -la build/stage/naudiodon2/v2.4.2/

    - name: Publish binaries
      run: npm run publish-binary
      env:
        NODE_PRE_GYP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 