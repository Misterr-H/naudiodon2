name: Build and Publish Binaries

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            node-version: '22'
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            node-version: '22'
          - os: macos-14
            platform: darwin
            arch: arm64
            node-version: '22'
          - os: windows-latest
            platform: win32
            arch: x64
            node-version: '22'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3

    - name: Install dependencies
      run: npm ci

    - name: Debug info
      run: |
        echo "Node version: $(node --version)"
        echo "Platform: ${{ matrix.platform }}"
        echo "Arch: ${{ matrix.arch }}"
        echo "Node version: ${{ matrix.node-version }}"
        echo "Node-gyp version: $(node-gyp --version)"
        echo "NPM version: $(npm --version)"

    - name: Build binary
      run: |
        npm run build
        npm run package
      env:
        npm_config_target: ${{ matrix.node-version }}
        npm_config_arch: ${{ matrix.arch }}
        npm_config_target_platform: ${{ matrix.platform }}

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.platform }}-${{ matrix.arch }}-node${{ matrix.node-version }}
        path: build/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: build/

    - name: Publish binaries
      run: npm run publish-binary
      env:
        NODE_PRE_GYP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 